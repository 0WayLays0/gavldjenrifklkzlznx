plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}-forge-${minecraft_version}"
group = mod_group_id

base {
    archivesName = archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Automated client test (debug/SmokeTest), only with -Peraphones.autotest=true
            if (project.hasProperty('eraphones.autotest')) {
                property 'eraphones.autotest', project.property('eraphones.autotest')
            }
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
        }
    }
}

mixin {
    add sourceSets.main, 'eraphones.refmap.json'
    config 'eraphones.mixins.json'
}

repositories {
    maven {
        name = 'Simple Voice Chat'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.voicechat'
        }
    }
    mavenCentral()
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Simple Voice Chat's API, to build against only: the mod works without it, and with it when it is installed
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    // JCodec (pure Java, BSD licence): reads the MP4 films on video cassettes; packed inside the mod's jar
    implementation 'org.jcodec:jcodec:0.2.5'
    minecraftLibrary 'org.jcodec:jcodec:0.2.5'
    jarJar('org.jcodec:jcodec:0.2.5') {
        jarJar.ranged(it, '[0.2.5,0.3)')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'eraphones.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}

reobf {
    jarJar {}
}
