name: Build & Test

on:
  push:
    paths-ignore:
      - 'era-phones/**'
      - 'cinematic-forge/**'
      - '.github/workflows/cinematic-forge.yml'
      - '.github/workflows/era-phones.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Iron's Spells versions on its maven
        run: |
          for a in irons_spellbooks irons_lib; do
            echo "== $a"; curl -s "https://code.redspace.io/releases/io/redspace/$a/maven-metadata.xml" | grep -oE '<(version|latest|release)>1\.21[^<]*' | tail -n 8 || true
          done

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle121-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle121-${{ runner.os }}-

      - name: Build (compile, jar)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Run GameTests on a headless server (mod loads with Iron's Spells, spells work)
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log
          # The run task succeeds even when the server never starts: the tests' own verdict decides
          grep -q "required tests passed" gametest.log || { echo "::error::The GameTests did not all pass (or never ran)"; exit 1; }

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: arcanes-oublies-jar
          path: build/libs/arcanes-oublies-*.jar
          if-no-files-found: error

      - name: Report
        if: always()
        run: |
          echo "================ REPORT ================"
          if [ -f build.log ]; then
            echo "--- compiler errors ---"
            grep -E "error:|FAILED|What went wrong|Could not (find|resolve)" -A3 build.log | head -n 600 || true
          fi
          if [ -f gametest.log ]; then
            echo "--- gametests ---"
            grep -E "GameTest|required tests|failed|Exception|Caused by|ERROR" gametest.log | head -n 200 || true
          fi

  epic-npc:
    # A dedicated server with Epic Fight and Custom NPCs (from Modrinth; Custom NPCs does not start on the GameTest
    # server): an NPC gets an Epic Fight body from the built-in data pack, and its blow is held back while its attack
    # animation swings (debug/EpicNpcServerCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle121-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle121-${{ runner.os }}-

      - name: A dedicated server with Epic Fight and Custom NPCs
        timeout-minutes: 20
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\n' > run/server.properties
          timeout 900 ./gradlew runServer -Parcanes.epicnpc=true -Parcanes.epicnpccheck=true --console=plain 2>&1 | tee epicnpc.log || true
          grep -q "\[EpicNpcCheck\] PASS" epicnpc.log || { echo "::error::The Epic Fight x Custom NPCs check did not pass"; exit 1; }

      - name: Report
        if: always()
        run: |
          if [ -f epicnpc.log ]; then
            grep -E "EpicNpcCheck|could not|error:|What went wrong|Could not (find|resolve)|Exception|Caused by|ERROR|Mob Patch|mob capability|Can.t deserialize" epicnpc.log | head -n 300 || true
          fi

  client-smoke:
    # Real client under xvfb + Mesa software rendering: creative world, every addon spell cast in front of the
    # camera (debug/ClientSmokeTest). Fails on a client crash, a spell that throws, or no PASS line.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle and ForgeGradle (client)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle121-client-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle121-client-${{ runner.os }}-
            gradle121-${{ runner.os }}-

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null

      - name: Run client smoke test
        timeout-minutes: 38
        run: |
          chmod +x gradlew
          mkdir -p run
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\nnarrator:0\nsoundCategory_master:0.0\nrenderDistance:6\nsimulationDistance:6\npauseOnLostFocus:false\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          # Spells photographed into the log (see ClientSmokeTest), for a look at how they render
          SHOTS="school:snow,school:lava,school:plant,school:acid,metiers"
          timeout --kill-after=30s 2040 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Parcanes.autotest=true "-Parcanes.shots=$SHOTS" --console=plain > client.log 2>&1
          code=$?
          set -e
          echo "CLIENT_EXIT=$code" >> "$GITHUB_ENV"
          echo "client exit code: $code"

      - name: Report (client)
        if: always()
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=client.log
          echo "client exit code: ${CLIENT_EXIT:-unknown}, log: $LOG"
          echo "--- failures ---"
          { grep -h '\[SmokeTest\] FAIL' "$LOG" || true; } | cut -c1-400 | head -n 40
          echo "::group::[SmokeTest] lines"
          { grep -h '\[SmokeTest\]' "$LOG" || true; } | cut -c1-400 | head -n 80
          echo "::endgroup::"
          echo "::group::Exceptions through mod code"
          { grep -nE -B8 -A12 '^[[:space:]]+at com\.waylays\.' "$LOG" || true; } | cut -c1-300 | head -n 200
          echo "::endgroup::"
          for f in run/crash-reports/*.txt run/hs_err_pid*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            head -n 150 "$f" | cut -c1-300
            echo "::endgroup::"
          done
          echo "::group::Screenshots (base64 JPEG)"
          { grep -h '\[SmokeShot\]' "$LOG" || true; } | sed 's/.*\[SmokeShot\] /SHOT /'
          echo "::endgroup::"
          echo "--- tail of client.log ---"
          tail -n 40 client.log | cut -c1-300 || true

      - name: Verdict
        if: always()
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=client.log
          if ls run/crash-reports/*.txt > /dev/null 2>&1; then echo "::error::The client crashed (see crash report above)"; exit 1; fi
          if grep -q '\[SmokeTest\] FAIL' "$LOG"; then echo "::error::Smoke test reported a failure"; exit 1; fi
          if ! grep -q '\[SmokeTest\] PASS' "$LOG"; then echo "::error::No PASS line (exit code ${CLIENT_EXIT:-unknown})"; exit 1; fi
          echo "Client smoke test passed"
