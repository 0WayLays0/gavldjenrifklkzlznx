name: Build & Test

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build (compile, reobf jar)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Run GameTests on a headless server (mod loads with Iron's Spells, spells work)
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: arcanes-oublies-jar
          path: build/libs/arcanes-oublies-*.jar
          if-no-files-found: error

      - name: Report
        if: always()
        run: |
          echo "================ REPORT ================"
          if [ -f build.log ]; then
            echo "--- compiler errors ---"
            grep -E "error:|warning: \[deprecation\]|FAILED|What went wrong" -A3 build.log | head -n 250 || true
          fi
          if [ -f gametest.log ]; then
            echo "--- gametests ---"
            grep -E "GameTest|required tests|failed|Exception|Caused by|ERROR" gametest.log | head -n 200 || true
          fi

  client-smoke:
    # Real client under xvfb + Mesa software rendering: creative world, every addon spell cast in front of the
    # camera (debug/ClientSmokeTest). Fails on a client crash, a spell that throws, or no PASS line.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and ForgeGradle (client)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-client-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-client-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null

      - name: Run client smoke test
        timeout-minutes: 35
        run: |
          chmod +x gradlew
          mkdir -p run
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\nnarrator:0\nsoundCategory_master:0.0\nrenderDistance:6\nsimulationDistance:6\npauseOnLostFocus:false\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          timeout --kill-after=30s 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Parcanes.autotest=true --console=plain > client.log 2>&1
          code=$?
          set -e
          echo "CLIENT_EXIT=$code" >> "$GITHUB_ENV"
          echo "client exit code: $code"

      - name: Report (client)
        if: always()
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=client.log
          echo "client exit code: ${CLIENT_EXIT:-unknown}, log: $LOG"
          echo "::group::[SmokeTest] lines"
          { grep -h '\[SmokeTest\]' "$LOG" || true; } | cut -c1-400 | head -n 80
          echo "::endgroup::"
          echo "::group::Exceptions through mod code"
          { grep -nE -B8 -A12 '^[[:space:]]+at com\.waylays\.' "$LOG" || true; } | cut -c1-300 | head -n 200
          echo "::endgroup::"
          for f in run/crash-reports/*.txt run/hs_err_pid*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            head -n 150 "$f" | cut -c1-300
            echo "::endgroup::"
          done
          echo "--- tail of client.log ---"
          tail -n 40 client.log | cut -c1-300 || true

      - name: Verdict
        if: always()
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=client.log
          if ls run/crash-reports/*.txt > /dev/null 2>&1; then echo "::error::The client crashed (see crash report above)"; exit 1; fi
          if grep -q '\[SmokeTest\] FAIL' "$LOG"; then echo "::error::Smoke test reported a failure"; exit 1; fi
          if ! grep -q '\[SmokeTest\] PASS' "$LOG"; then echo "::error::No PASS line (exit code ${CLIENT_EXIT:-unknown})"; exit 1; fi
          echo "Client smoke test passed"
