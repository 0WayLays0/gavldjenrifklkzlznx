name: Build & Test

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build (compile, reobf jar)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Run GameTests on a headless server (mod loads with Iron's Spells, spells work)
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: arcanes-oublies-jar
          path: build/libs/arcanes-oublies-*.jar
          if-no-files-found: error

      - name: Report
        if: always()
        run: |
          echo "================ REPORT ================"
          if [ -f build.log ]; then
            echo "--- compiler errors ---"
            grep -E "error:|warning: \[deprecation\]|FAILED|What went wrong" -A3 build.log | head -n 250 || true
          fi
          if [ -f gametest.log ]; then
            echo "--- gametests ---"
            grep -E "GameTest|required tests|failed|Exception|Caused by|ERROR" gametest.log | head -n 200 || true
          fi
