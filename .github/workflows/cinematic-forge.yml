name: Cinematic (Forge 1.20.1)

on:
  push:
    paths:
      - 'cinematic-forge/**'
      - '.github/workflows/cinematic-forge.yml'
  workflow_dispatch:

concurrency:
  group: cinematic-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: cinematic-forge-${{ runner.os }}-${{ hashFiles('cinematic-forge/build.gradle', 'cinematic-forge/settings.gradle', 'cinematic-forge/gradle.properties') }}
          restore-keys: |
            cinematic-forge-${{ runner.os }}-
            eraphones-forge-${{ runner.os }}-

      - name: Build (compile, jar)
        working-directory: cinematic-forge
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-forge-1.20.1-jar
          path: cinematic-forge/build/libs/cinematic-*-forge-1.20.1.jar

      - name: Report (compiler)
        if: always()
        working-directory: cinematic-forge
        run: |
          if [ -f build.log ]; then
            grep -cE "error:" build.log || true
            grep -E "error:|What went wrong|Could not (find|resolve)" -A2 build.log | head -n 3000 || true
          fi

  client-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle (client)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: cinematic-forge-client-${{ runner.os }}-${{ hashFiles('cinematic-forge/build.gradle', 'cinematic-forge/settings.gradle', 'cinematic-forge/gradle.properties', 'cinematic-forge/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            cinematic-forge-client-${{ runner.os }}-
            cinematic-forge-${{ runner.os }}-

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null

      - name: Run client smoke test
        timeout-minutes: 32
        working-directory: cinematic-forge
        run: |
          chmod +x gradlew
          mkdir -p run
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\nnarrator:0\nsoundCategory_master:0.0\nrenderDistance:6\nsimulationDistance:6\npauseOnLostFocus:false\nguiScale:0\nlang:fr_fr\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          timeout --kill-after=30s 1800 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClient -Pcinematic.autotest=true --console=plain > client.log 2>&1
          code=$?
          set -e
          echo "CLIENT_EXIT=$code" >> "$GITHUB_ENV"

      - name: Report (client)
        if: always()
        working-directory: cinematic-forge
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=client.log
          echo "client exit code: ${CLIENT_EXIT:-unknown}"
          echo "--- failures ---"
          { grep -h '\[SmokeTest\] FAIL' "$LOG" || true; } | cut -c1-400 | head -n 40
          echo "::group::[SmokeTest] lines"
          { grep -h '\[SmokeTest\]' "$LOG" || true; } | cut -c1-400 | head -n 80
          echo "::endgroup::"
          echo "::group::Exceptions through mod code"
          { grep -nE -B8 -A12 '^[[:space:]]+at com\.waylays\.' "$LOG" || true; } | cut -c1-300 | head -n 200
          echo "::endgroup::"
          for f in run/crash-reports/*.txt; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            head -n 150 "$f" | cut -c1-300
            echo "::endgroup::"
          done
          echo "::group::Screenshots (base64 JPEG)"
          { grep -h '\[SmokeShot\]' "$LOG" || true; } | sed 's/.*\[SmokeShot\] /SHOT /'
          echo "::endgroup::"
          echo "--- tail of client.log ---"
          tail -n 40 client.log | cut -c1-300 || true

      - name: Verdict
        if: always()
        working-directory: cinematic-forge
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=client.log
          if ls run/crash-reports/*.txt > /dev/null 2>&1; then echo "::error::The client crashed"; exit 1; fi
          if grep -q '\[SmokeTest\] FAIL' "$LOG"; then echo "::error::Smoke test reported a failure"; exit 1; fi
          if ! grep -q '\[SmokeTest\] PASS' "$LOG"; then echo "::error::No PASS line (exit code ${CLIENT_EXIT:-unknown})"; exit 1; fi
          echo "Client smoke test passed"
