name: Era Phones (Forge 1.20.1)

on:
  push:
    paths:
      - 'era-phones-forge/**'
      - '.github/workflows/era-phones-forge.yml'
  workflow_dispatch:

concurrency:
  group: era-phones-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: eraphones-forge-${{ runner.os }}-${{ hashFiles('era-phones-forge/build.gradle', 'era-phones-forge/settings.gradle', 'era-phones-forge/gradle.properties', 'era-phones-forge/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            eraphones-forge-${{ runner.os }}-

      - name: Build (compile, jar)
        working-directory: era-phones-forge
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Run GameTests on a headless server
        timeout-minutes: 15
        working-directory: era-phones-forge
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log
          grep -q "required tests passed" gametest.log || { echo "::error::The GameTests did not all pass (or never ran)"; exit 1; }

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: epoque-rp-forge-1.20.1-jar
          path: era-phones-forge/build/libs/epoque-rp-*-forge-1.20.1.jar
          if-no-files-found: error

      - name: Report
        if: always()
        working-directory: era-phones-forge
        run: |
          if [ -f build.log ]; then
            echo "--- compiler errors ---"
            grep -cE "error:" build.log || true
            grep -E "error:|What went wrong|Could not (find|resolve)" -A2 build.log | head -n 6000 || true
          fi
          if [ -f gametest.log ]; then
            echo "--- gametests ---"
            grep -E "GameTest|required tests|failed|Exception|Caused by|ERROR" gametest.log | head -n 200 || true
          fi
